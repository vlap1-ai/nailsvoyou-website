<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NailsVoYou</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- FAVICON (optional) -->
    <link rel="icon" href="{{ url_for('static', filename='nail background.jpg') }}">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <h2>NailsVoYou</h2>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<!-- HERO -->
<section id="home" class="hero">

    <div class="hero-text">
        <h1>Beautiful Nails, Beautiful You 💅</h1>
        <p>Luxury nail care & modern designs</p>

        <a class="btn" href="#gallery">View Gallery</a>
    </div>

    <div class="hero-img">
        <img src="{{ url_for('static', filename='nail background.jpg') }}" alt="logo">
    </div>

</section>

<!-- GALLERY -->
<section id="gallery" class="gallery">
    <h2>Our Work</h2>

    <div class="grid">
        <img src="{{ url_for('static', filename='nail example 1.jpeg') }}">
        <img src="{{ url_for('static', filename='nail example 2.jpeg') }}">
        <img src="{{ url_for('static', filename='nail example 3.jpeg') }}">
        <img src="{{ url_for('static', filename='nail example 4.jpeg') }}">
        <img src="{{ url_for('static', filename='nail example 5.jpeg') }}">
        <img src="{{ url_for('static', filename='nail example 6.jpeg') }}">
    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
    <h2>Contact</h2>

    <p>📞 (253) 409-9823</p>
    <p>📧 phuma1959@gmail.com</p>
    <p>📍 Renton, WA</p>
</section>

<!-- FOOTER -->
<footer>
    <p>© NailsVoYou</p>
</footer>

</body>
</html>
